  <body class="point-app">
    <div id="web-chat-root"></div>
    <script>
      (() => {
        const retryKey = 'finclaw:vite-boot-retry'
        const entryPath = '/src/chat/webchat/FinAgentApp.tsx'

        window.addEventListener('error', event => {
          const target = event.target
          if (!(target instanceof HTMLScriptElement) || target.type !== 'module') return
          if (new URL(target.src, window.location.href).pathname !== entryPath) return

          if (window.sessionStorage.getItem(retryKey) === 'pending') {
            document.getElementById('web-chat-root')?.append('页面加载失败，请刷新重试')
            return
          }
          window.sessionStorage.setItem(retryKey, 'pending')
          window.location.reload()
        }, true)

        window.addEventListener('load', () => {
          window.setTimeout(() => {
            if (document.getElementById('web-chat-root')?.childElementCount) {
              window.sessionStorage.removeItem(retryKey)
            }
          }, 1_000)
        }, { once: true })
      })()
    </script>
  </body>
