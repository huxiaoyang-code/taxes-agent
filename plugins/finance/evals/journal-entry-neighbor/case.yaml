schema_version: "1.1"
name: journal-entry-neighbor
tags: [routing, neighbor]
execution:
  prompt: "凭证已经过账，请编制当期资产负债表并检查勾稽。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?financial-statements"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?journal-entry"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '资产负债|利润表'
