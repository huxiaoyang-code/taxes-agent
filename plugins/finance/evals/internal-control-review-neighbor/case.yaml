schema_version: "1.1"
name: internal-control-review-neighbor
tags: [routing, neighbor]
execution:
  prompt: "本期发票和流水已经补齐，请接前次进度完成整期账税并交接下月。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tax-period"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?internal-control-review"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '本期|十月|10 月'
