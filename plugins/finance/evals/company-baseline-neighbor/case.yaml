schema_version: "1.1"
name: company-baseline-neighbor
tags: [routing, neighbor]
execution:
  prompt: "合同与验收单已齐，按确认过的办法列出该笔采购的入账分录。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?journal-entry"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?company-baseline"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '借|贷|分录'
