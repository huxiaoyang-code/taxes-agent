schema_version: "1.1"
name: tax-period-positive
tags: [routing, positive]
execution:
  prompt: "把十月账税办完，检查月末哪些核对会影响关账顺序，留下十一月会计可以继续办理的事项。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tax-period"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reconciliation"'
    min: 0
    max: 0
    arm: both
  - name: consulted-reference
    type: tool_used
    tool: Read
    input_match: 'close-management\.md'
    min: 1
    arm: with-only
  - name: business-output
    type: regex
    target: last_message
    pattern: '本期|十月|10 月'
