schema_version: "1.1"
name: prebook-review-neighbor
tags: [routing, neighbor]
execution:
  prompt: "已经有发票台账与留抵余额，比较现在选票和下月选票的现金影响。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tax-review"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?prebook-review"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '抵扣|进项|留抵'
