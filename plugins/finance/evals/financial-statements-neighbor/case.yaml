schema_version: "1.1"
name: financial-statements-neighbor
tags: [routing, neighbor]
execution:
  prompt: "两期报表已签发，解释毛利率下降是哪些业务量或价格变化造成。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?variance-analysis"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?financial-statements"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '数量|售价|成本'
