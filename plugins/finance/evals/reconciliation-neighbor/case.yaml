schema_version: "1.1"
name: reconciliation-neighbor
tags: [routing, neighbor]
execution:
  prompt: "想抽查收付授权和职责分离是否执行，设计穿行测试和抽样依据。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?internal-control-review"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reconciliation"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '控制|复核|授权'
