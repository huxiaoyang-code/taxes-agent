schema_version: "1.1"
name: tax-period-neighbor
tags: [routing, neighbor]
execution:
  prompt: "只核银行这笔跨日收款和账簿能否勾对，给出对账差异。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reconciliation"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tax-period"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '流水|客户|差异'
