schema_version: "1.1"
name: tax-review-neighbor
tags: [routing, neighbor]
execution:
  prompt: "第一批原件到了，先确认文件是否齐备并列出重复件与客观缺项。"
  allowed_tools: [Read, Skill]
graders:
  - name: selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?prebook-review"'
    min: 1
  - name: avoided-neighbor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tax-review"'
    min: 0
    max: 0
    arm: both
  - name: business-output
    type: regex
    target: last_message
    pattern: '资料|原件|证据'
